const pendingDocs = () => 2 - state.signedDocs.length;
const storeTimeZone = "Europe/Moscow";
function nowParts(){
  const now=new Date();
  return {
    date:new Intl.DateTimeFormat("ru-RU",{weekday:"long",day:"numeric",month:"long",timeZone:storeTimeZone}).format(now),
    time:new Intl.DateTimeFormat("ru-RU",{hour:"2-digit",minute:"2-digit",timeZone:storeTimeZone}).format(now)
  };
}
function updateClock(){const value=nowParts();document.querySelectorAll("[data-now-date]").forEach(el=>el.textContent=value.date);document.querySelectorAll("[data-now-time]").forEach(el=>el.textContent=value.time);}

}

function routeParts(){const raw=(location.hash||"#home").slice(1);const [page,detail]=raw.split("/");return {page:page||"home",detail:detail||""};}
function go(route){location.hash=route;render(true);}
function head(eyebrow,title,subtitle=""){return `<div class="page-intro"><div class="eyebrow">${esc(eyebrow)}</div><h1>${esc(title)}</h1>${subtitle?`<p>${esc(subtitle)}</p>`:""}</div>`;}
function section(title,actionLabel="",route="",subtitle=""){return `<div class="section-heading"><div><h2>${esc(title)}</h2>${subtitle?`<p>${esc(subtitle)}</p>`:""}</div>${actionLabel?`<button class="text-link" data-route="${esc(route)}">${esc(actionLabel)} ${ico("arrow")}</button>`:""}</div>`;}
function btn(label,action,value="",secondary=false,icon=""){return `<button class="button ${secondary?"secondary":""}" data-action="${esc(action)}" data-value="${esc(value)}">${icon?ico(icon):""}${esc(label)}</button>`;}
function notice(text,warning=false){return `<div class="notice ${warning?"warn":""}">${esc(text)}</div>`;}
function serviceModal(service,context){modal(service,`<p>${esc(context||"Открыть сервис")}</p>`,`<button class="button" data-action="close">Вернуться в SELA Staff</button>`);}
function modal(title,body,footer=""){$("#modal-root").innerHTML=`<div class="modal-backdrop" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="modal-close" data-action="close" aria-label="Закрыть">${ico("close")}</button></div>${body}${footer?`<div class="button-row">${footer}</div>`:""}</section></div>`;$(".modal-close")?.focus();}
function closeModal(){$("#modal-root").innerHTML="";}
let toastTimer;
function toast(message){const el=$("#toast");el.textContent=message;el.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove("show"),3200);}

function employeeHome(){
  const person=roles[state.role];
  const atStore=state.role==="employee"||state.role==="manager";
  return `<section class="hero employee-hero"><div class="hero-top"><div><h1>Добрый день, ${esc(person.person.split(" ")[0])}</h1><span class="hero-date" data-now-date></span></div><strong class="hero-time" data-now-time></strong></div><div class="hero-place"><span>${atStore?"Магазин":"Подразделение"}</span><strong>${esc(person.unit)}</strong></div></section>`+
  `<div class="stats-grid"><button class="stat-card" data-route="work/schedule"><span class="source">СМЕНА</span><strong>10:00-22:00</strong><span>Сегодня</span></button><button class="stat-card" data-route="work/leave"><span class="source">ОТПУСК</span><strong>18 дней</strong><span>Остаток</span></button><button class="stat-card" data-route="docs"><span class="source">ДОКУМЕНТЫ</span><strong>${pendingDocs()} на подпись</strong><span>${pendingDocs()?"Требуют действия":"Нет новых задач"}</span></button></div>`+
  `<div class="content-grid"><section>${section("Быстрые действия","Все сервисы","services")}<div class="quick-grid">${[
    ["График","calendar","work/schedule"],["Отпуск","clock","work/leave"],["Расчетник","file","work/payslip"],
    ["КЭДО","file","docs"],["Обучение","book","learning"],["Компания","users","company"]
  ].map(([name,icon,route])=>`<button class="quick-card" data-route="${route}">${ico(icon)}<span>${name}</span></button>`).join("")}</div></section><section>${section("Мне нужно сделать")}<div class="task-list">${pendingDocs()?`<button class="task-row" data-route="docs"><span class="task-icon">${ico("file")}</span><span class="task-copy"><strong>Подписать документы</strong><small>${pendingDocs()===1?"1 документ":"2 документа"}</small></span>${ico("chevron")}</button>`:""}<button class="task-row" data-route="learning"><span class="task-icon">${ico("book")}</span><span class="task-copy"><strong>Продолжить обучение</strong><small>Новая коллекция · ${state.courseProgress}%</small></span>${ico("chevron")}</button><button class="task-row" data-route="work/payslip"><span class="task-icon">${ico("file")}</span><span class="task-copy"><strong>Посмотреть расчетный листок</strong><small>Октябрь 2026</small></span>${ico("chevron")}</button></div></section></div>`+
  section("Новости SELA","Все новости","news")+`<div class="news-grid">${state.news.slice(0,3).map(newsCard).join("")}</div>`;
}
function adminHome(){
  if(state.role==="content")return head("Публикации","Добрый день, Дарья")+
    `<div class="stats-grid"><button class="stat-card" data-route="news"><span class="source">НОВОСТИ</span><strong>${state.news.length}</strong><span>Опубликовано</span></button><button class="stat-card" data-route="editor"><span class="source">ПУБЛИКАЦИЯ</span><strong>Новая</strong><span>Создать новость</span></button><button class="stat-card" data-route="company"><span class="source">АУДИТОРИЯ</span><strong>Розница</strong><span>Сотрудники магазинов</span></button></div>`+section("Последние новости","Создать новость","editor")+`<div class="news-grid">${state.news.slice(0,3).map(newsCard).join("")}</div>`;
  return head("Администрирование","Добрый день, Игорь")+
    `<div class="stats-grid"><button class="stat-card" data-route="access"><span class="source">ДОСТУП</span><strong>6 ролей</strong><span>Роли пользователей</span></button><button class="stat-card" data-route="integrations"><span class="source">СИСТЕМЫ</span><strong>5</strong><span>Подключения</span></button><button class="stat-card" data-route="profile"><span class="source">ПРОФИЛЬ</span><strong>Игорь</strong><span>Системный администратор</span></button></div>`;
}
function home(){return ["content","system"].includes(state.role)?adminHome():employeeHome();}

function work(detail="schedule"){
  const tab=["schedule","leave","payslip"].includes(detail)?detail:"schedule";
  const tabs=[["schedule","Мой график"],["leave","Отпуск"],["payslip","Расчетник"]];
  return head("Моя работа",tab==="schedule"?"Мой график":tab==="leave"?"Отпуск":"Расчетный листок")+
    `<div class="panel"><div class="tabbar">${tabs.map(([id,label])=>`<button class="tab ${tab===id?"active":""}" data-route="work/${id}" aria-current="${tab===id?"page":"false"}">${label}</button>`).join("")}</div>${tab==="schedule"?schedule():tab==="leave"?leave():payslip()}</div>`;
}
function schedule(){
  const start=state.week?23:16;
  const scheduleData=state.week?["10:00","Выходной","10:00","10:00","Выходной","12:00","10:00"]:["10:00","Выходной","10:00","10:00","12:00","Выходной","10:00"];
  return `<div class="shift-banner"><div><span class="source">БЛИЖАЙШАЯ СМЕНА</span><strong>${state.week?"23":"16"} ноября · 10:00-22:00</strong></div>${ico("calendar")}</div>`+
    `<div class="section-heading"><div><h2>${state.week?"23-29":"16-22"} ноября 2026</h2></div><div class="button-row" style="margin:0"><button class="button ghost" data-action="week" data-value="0" ${state.week===0?"disabled":""}>Назад</button><button class="button ghost" data-action="week" data-value="1" ${state.week===1?"disabled":""}>Далее</button></div></div>`+
    `<div class="week-grid">${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map((day,i)=>`<div class="day ${i===0&&!state.week?"today":""} ${scheduleData[i]==="Выходной"?"off":""}"><b>${day} ${start+i}</b><strong>${scheduleData[i]}</strong>${scheduleData[i]!=="Выходной"?"<small>до 22:00</small>":""}</div>`).join("")}</div>`+
    `<div class="button-row">${btn("Открыть планирование","external","VERME|Планирование смен",false,"external")}</div>`;
}
function leave(){return `<div class="two-col"><div><div class="shift-banner"><div><span class="source">ОСТАТОК ОТПУСКА</span><div class="large-number">18 <small>дней</small></div></div>${ico("clock")}</div><div class="button-row">${btn("Оформить отпуск","leave-form","",false,"arrow")}</div></div><div class="panel"><h3>Мои заявки</h3>${state.leaveRequests.length?state.leaveRequests.map(r=>`<div class="info-row"><strong>${esc(r.from)} - ${esc(r.to)}</strong><span class="status wait">Черновик</span></div>`).join(""):`<p class="muted">Заявок нет</p>`}</div></div>`;}
function payslip(){return `<div class="panel"><h2>Расчетные листки</h2><div class="list"><div class="list-item"><span class="icon-wrap">${ico("file")}</span><div class="item-main"><strong>Октябрь 2026</strong><small>Доступен</small></div><button class="button secondary" data-action="payslip">Открыть</button></div><div class="list-item"><span class="icon-wrap">${ico("file")}</span><div class="item-main"><strong>Сентябрь 2026</strong><small>Доступен</small></div><button class="button secondary" data-action="payslip">Открыть</button></div></div></div>`;}
function docs(){
  const documents=[
    {id:"agreement",name:"Дополнительное соглашение",deadline:"20 ноября"},
    {id:"schedule",name:"Ознакомление с графиком",deadline:"22 ноября"}
  ].filter(d=>!state.signedDocs.includes(d.id));
  return head("КЭДО","Мои документы")+
  `<div class="two-col"><div class="panel"><h2>На подпись</h2><div class="list">${documents.length?documents.map(d=>`<div class="list-item"><span class="icon-wrap">${ico("file")}</span><div class="item-main"><strong>${d.name}</strong><small>До ${d.deadline}</small></div><button class="button secondary" data-action="doc" data-value="${d.id}">Открыть</button></div>`).join(""):`<div class="empty"><strong>Новых документов нет</strong></div>`}</div></div><div class="panel"><h2>Статус</h2><div class="info-row"><span>На подпись</span><strong>${pendingDocs()}</strong></div><div class="info-row"><span>Подписано</span><strong>${1+state.signedDocs.length}</strong></div></div></div>`;
}
function learning(){return head("Обучение","Мои курсы")+
  `<div class="two-col"><div class="panel"><h2>Назначено мне</h2><div class="list"><div class="list-item"><span class="icon-wrap">${ico("book")}</span><div class="item-main"><strong>Новая коллекция: материалы и образы</strong><small>До 30 ноября</small><div class="progress"><span style="width:${state.courseProgress}%"></span></div><small>Пройдено ${state.courseProgress}%</small></div><button class="button secondary" data-action="course">Открыть</button></div><div class="list-item"><span class="icon-wrap">${ico("book")}</span><div class="item-main"><strong>Стандарты сервиса SELA</strong><small>Базовый курс</small></div><span class="status done">Пройден</span></div></div></div><div class="panel"><h2>Прогресс</h2><div class="large-number">${state.courseProgress}%</div></div></div>`;
}
function personCard(p){return `<button class="person-card" data-action="person" data-value="${p.id}"><span class="person-avatar">${p.initials}</span><span><strong>${esc(p.name)}</strong><small>${esc(p.job)} · ${esc(p.unit)}</small></span></button>`;}
function company(){return head("Компания","Люди SELA")+
  `<div class="two-col"><div class="panel"><h2>Поиск сотрудников</h2><div class="directory-search"><input id="directory-query" class="field" type="search" placeholder="Имя, должность или магазин" aria-label="Поиск сотрудников"></div><div id="directory-list" class="person-list">${people.map(personCard).join("")}</div></div><div class="panel"><h2>Моя линия</h2><div class="info-row"><span>Территориальный руководитель</span><strong>Ольга Миронова</strong></div><div class="info-row"><span>Руководитель магазина</span><strong>Мария Белова</strong></div><div class="info-row"><span>Моя роль</span><strong>${esc(roles[state.role].job)}</strong></div></div></div>`;}
function newsCard(item){return `<button class="news-card" data-action="news" data-value="${item.id}"><span class="meta">${esc(item.category)} · ${esc(item.date)}</span><strong>${esc(item.title)}</strong></button>`;}
function news(){return head("Новости","Что нового в SELA")+
  `<div class="news-grid">${state.news.map(newsCard).join("")}</div><div class="panel" style="margin-top:20px"><h2>Уведомления</h2><div class="list-item"><span class="icon-wrap">${ico("bell")}</span><div class="item-main"><strong>${pendingDocs()?"Нужно подписать документы":"Документы подписаны"}</strong></div><button class="button secondary" data-route="docs">Открыть</button></div></div>`;}
function servicesPage(){return head("Сервисы","Рабочие сервисы")+
  `<div class="service-grid">${services.map(s=>`<button class="service-card" data-action="service" data-value="${esc(s.name)}">${ico(s.icon)}<strong>${esc(s.name)}</strong><small>${esc(s.description)}</small></button>`).join("")}</div>`;}
function profile(){const p=roles[state.role];return head("Профиль","Мой профиль")+
  `<div class="profile-grid"><div class="panel"><div style="display:flex;align-items:center;gap:15px"><span class="person-avatar" style="width:58px;height:58px;font-size:17px">${p.initials}</span><div><h2 style="margin:0">${esc(p.person)}</h2><span class="muted">${esc(p.job)}</span></div></div><div class="info-row"><span>Подразделение</span><strong>${esc(p.unit)}</strong></div><div class="info-row"><span>Роль</span><strong>${esc(p.label)}</strong></div></div><div class="panel"><h2>Кабинет</h2>${rolePicker()}<div class="button-row">${btn("Выйти","logout","",true)}</div></div></div>`;}
function menu(){return head("Разделы","Все разделы")+
  `<div class="menu-grid">${roleNav[state.role].map(([route,icon,label])=>`<button class="menu-item" data-route="${route}">${ico(icon)}<span>${esc(label)}</span>${ico("chevron")}</button>`).join("")}</div>`;}
function editor(){return head("Публикации","Новая новость")+
  `<div class="two-col"><div class="panel"><form id="news-form" class="form-grid"><div class="form-group"><label for="news-category">Рубрика</label><select class="field" id="news-category" name="category"><option>Команда</option><option>Магазины</option><option>Обучение</option></select></div><div class="form-group"><label for="news-audience">Аудитория</label><select class="field" id="news-audience" name="audience"><option>Вся розница</option><option>Сотрудники магазинов</option></select></div><div class="form-group full"><label for="news-title">Заголовок</label><input class="field" id="news-title" name="title" required maxlength="90" placeholder="Заголовок"></div><div class="form-group full"><label for="news-body">Текст</label><textarea class="field" id="news-body" name="body" required maxlength="800"></textarea></div><div class="form-group full"><button class="button" type="submit">Опубликовать</button></div></form></div><div class="panel"><h2>Последние публикации</h2>${state.news.slice(0,3).map(n=>`<div class="info-row"><strong>${esc(n.title)}</strong><span>${esc(n.date)}</span></div>`).join("")}</div></div>`;}
function access(){return head("Администрирование","Роли и доступ")+
  `<div class="panel"><div class="list">${Object.values(roles).map(r=>`<div class="info-row"><strong>${esc(r.label)}</strong><span>${esc(r.job)}</span></div>`).join("")}</div></div>`;}
function integrations(){return head("Администрирование","Подключения")+
  `<div class="panel"><div class="list">${["1С ЗУП","VERME","VK HR","VK КЭДО","iSpring"].map((name,i)=>`<div class="list-item"><span class="icon-wrap">${ico(i===0?"users":i===1?"calendar":i===4?"book":"file")}</span><div class="item-main"><strong>${name}</strong><small>${["Профиль и оргструктура","Личный график","Отпуск и листки","Документы и статусы","Курсы и прогресс"][i]}</small></div></div>`).join("")}</div></div>`;}

const pageFns={home,work,docs,learning,company,news,services:servicesPage,profile,menu,editor,access,integrations};
function render(scroll=false){
  if(!state.authenticated){$("#login-screen").hidden=false;$(".app-shell").hidden=true;$("#login-screen").innerHTML=login();document.title="Вход · SELA Staff";return;}
  $("#login-screen").hidden=true;$(".app-shell").hidden=false;
  const current=roles[state.role];let {page,detail}=routeParts();
  if(!pageFns[page] || (page!=="menu"&&!roleNav[state.role].some(([id])=>id===page))){page="home";detail="";}
  $("#role-picker-desktop").innerHTML=rolePicker();
  $(".sidebar-section").textContent="РАЗДЕЛЫ";
  $("#desktop-nav").innerHTML=roleNav[state.role].map(([id,icon,label])=>`<button class="nav-link ${id===page?"active":""}" data-route="${id}" ${id===page?'aria-current="page"':""}>${ico(icon)}<span>${esc(label)}</span>${id==="docs"&&pendingDocs()?`<span class="count">${pendingDocs()}</span>`:""}</button>`).join("");
  const mobile=[["home","home","Главная"],["work","calendar","Работа"],["docs","file","КЭДО"],["learning","book","Учеба"],["menu","menu","Меню"]];
  const adminMobile=[["home","home","Главная"],[state.role==="content"?"editor":"access",state.role==="content"?"news":"users",state.role==="content"?"Публикации":"Доступ"],[state.role==="content"?"news":"integrations",state.role==="content"?"bell":"grid",state.role==="content"?"Новости":"Системы"],["profile","user","Профиль"],["menu","menu","Меню"]];
  $("#mobile-nav").innerHTML=(["content","system"].includes(state.role)?adminMobile:mobile).map(([id,icon,label])=>`<button data-route="${id}" class="${id===page?"active":""}" ${id===page?'aria-current="page"':""}>${ico(icon)}<span>${esc(label)}</span></button>`).join("");
  $("#avatar-initials").textContent=current.initials;
  $("#app").innerHTML=page==="work"?work(detail):pageFns[page]();
  updateClock();
  document.title=`${page==="home"?"Главная":roleNav[state.role].find(([id])=>id===page)?.[2]||"SELA Staff"} · SELA Staff`;
  if(scroll)window.scrollTo({top:0,behavior:"instant"});
}

document.addEventListener("click",(event)=>{
  const target=event.target.closest("[data-route],[data-action]");if(!target)return;
  if(target.dataset.route){go(target.dataset.route);return;}
  const {action,value}=target.dataset;
  if(action==="role"){state.role=value;closeModal();if(state.authenticated){location.hash="home";render(true);}else render();return;}
  if(action==="logout"){state.authenticated=false;state.role="employee";location.hash="";render(true);return;}
  if(action==="backdrop"){if(event.target===target)closeModal();return;}
  if(action==="close"){closeModal();return;}
  if(action==="external"){const [service,context]=value.split("|");serviceModal(service,context);return;}
  if(action==="service"){
    const s=services.find(item=>item.name===value);if(!s)return;
    const route={"Мой график":"work/schedule","Отпуск":"work/leave","Расчетный листок":"work/payslip","Кадровые документы":"docs","Обучение":"learning"}[value];
    if(route)go(route);else serviceModal(s.source,s.name);return;
  }
  if(action==="week"){state.week=Number(value);render();return;}
  if(action==="leave-form"){
    modal("Оформить отпуск",`<form id="leave-form" class="form-grid"><div class="form-group"><label for="leave-from">С</label><input class="field" id="leave-from" name="from" type="date" required></div><div class="form-group"><label for="leave-to">По</label><input class="field" id="leave-to" name="to" type="date" required></div><div class="form-group full"><button class="button" type="submit">Сохранить черновик</button></div></form>`);return;
  }
  if(action==="payslip"){
    modal("Расчетный листок · октябрь 2026",`<div class="info-row"><span>Начислено</span><strong>58 400 руб.</strong></div><div class="info-row"><span>Удержано</span><strong>7 592 руб.</strong></div><div class="info-row"><span>К выплате</span><strong>50 808 руб.</strong></div>`);return;
  }
  if(action==="doc"){
    modal(value==="agreement"?"Дополнительное соглашение":"Ознакомление с графиком",`<div class="panel"><strong>${value==="agreement"?"Дополнительное соглашение к трудовому договору":"Ознакомление с графиком работы"}</strong><p class="muted">Документ на подпись</p></div>`,`${btn("Подписать","sign",value,false,"check")}${btn("Закрыть","close","",true)}`);return;
  }
  if(action==="sign"){if(!state.signedDocs.includes(value))state.signedDocs.push(value);closeModal();render();toast("Документ подписан");return;}
  if(action==="course"){
    modal("Новая коллекция: материалы и образы",`<p class="subtle">До 30 ноября</p><div class="progress"><span style="width:${state.courseProgress}%"></span></div><p>Пройдено ${state.courseProgress}%</p>`,`${btn("Завершить курс","course-finish","",false,"check")}${btn("Открыть в iSpring","external","iSpring|Курс: Новая коллекция",true,"external")}`);return;
  }
  if(action==="course-finish"){state.courseProgress=100;closeModal();render();toast("Курс завершен");return;}
  if(action==="person"){
    const person=people.find(p=>p.id===Number(value));if(!person)return;
    modal(person.name,`<p class="subtle">${esc(person.job)} · ${esc(person.unit)}</p><div class="info-row"><span>Руководитель</span><strong>${esc(person.manager)}</strong></div>`,`<button class="button secondary" data-action="close">Закрыть</button>`);return;
  }
  if(action==="news"){
    const item=state.news.find(n=>n.id===Number(value));if(!item)return;
    modal(item.title,`<p class="meta">${esc(item.category)} · ${esc(item.date)}</p><p>${esc(item.body)}</p>`,`<button class="button secondary" data-action="close">Закрыть</button>`);return;
  }
});
document.addEventListener("input",(event)=>{
  if(event.target.id==="directory-query"){
    const q=event.target.value.trim().toLocaleLowerCase("ru-RU");const result=people.filter(p=>`${p.name} ${p.job} ${p.unit}`.toLocaleLowerCase("ru-RU").includes(q));
    $("#directory-list").innerHTML=result.length?result.map(personCard).join(""):`<div class="empty"><strong>Никого не нашли</strong>Попробуйте другое имя или должность</div>`;
  }
  if(event.target.id==="global-search"){
    const q=event.target.value.trim().toLocaleLowerCase("ru-RU");const box=$("#search-results");
    if(!q){box.hidden=true;return;}
    const foundPeople=people.filter(p=>p.name.toLocaleLowerCase("ru-RU").includes(q)).slice(0,3);
    const foundSections=commonNav.filter(([, ,label])=>label.toLocaleLowerCase("ru-RU").includes(q)).slice(0,3);
    box.innerHTML=[...foundSections.map(([route,,label])=>`<button data-route="${route}">${esc(label)}<small>Раздел SELA Staff</small></button>`),...foundPeople.map(p=>`<button data-route="company">${esc(p.name)}<small>${esc(p.job)} · поиск сотрудников</small></button>`)].join("")||`<div class="empty">Ничего не найдено</div>`;
    box.hidden=false;
  }
});
document.addEventListener("submit",(event)=>{
  if(event.target.id==="login-form"){
    event.preventDefault();state.authenticated=true;state.role="employee";location.hash="home";render(true);return;
  }
  if(event.target.id==="leave-form"){
    event.preventDefault();const data=new FormData(event.target);const from=data.get("from"),to=data.get("to");
    if(from>to){toast("Дата окончания должна быть позже начала");return;}
    state.leaveRequests.unshift({from,to});closeModal();render();toast("Черновик сохранен");
  }
  if(event.target.id==="news-form"){
    event.preventDefault();const data=new FormData(event.target);const title=String(data.get("title")||"").trim(),body=String(data.get("body")||"").trim();
    if(!title||!body)return;
    state.news.unshift({id:Date.now(),date:"Сегодня",category:String(data.get("category")),title,body});go("news");toast("Новость опубликована");
  }
});
document.addEventListener("keydown",(event)=>{if(event.key==="Escape")closeModal();});
window.addEventListener("hashchange",()=>render(true));
setInterval(updateClock,30000);
render();

</script>
</body>
</html>
